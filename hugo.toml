baseURL = 'https://kwangsing3.github.io/'
locale = 'zh-tw'
title = '勃勃生機，萬物競發'

# Novela settings
theme = "github.com/forestryio/hugo-theme-novela"

paginate = 6

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true

[params]
defaultHero = "/images/hero-11.jpg"

[params.theme]
  lavaOverlayLight = "rgba(253, 224, 174, 0.76)"
  lavaOverlayDark  = "rgba(40, 40, 45, 0.78)"
  lavaBg           = "#1a0e02"
  glassBgLight     = "rgba(255, 255, 255, 0.55)"
  glassBgDark      = "rgba(67, 67, 67, 0.6)"
  glassBorderLight = "rgba(255, 255, 255, 0.8)"
  glassBorderDark  = "rgba(255, 255, 255, 0.08)"
  glassShadowLight = "rgba(0, 0, 0, 0.1)"
  glassShadowDark  = "rgba(0, 0, 0, 0.4)"
  bioTextLight     = "rgb(19, 19, 19)"
  bioTextDark      = "rgba(255, 255, 255, 0.75)"
  footerTextLight  = "#363636"
  footerTextDark   = "rgba(255, 255, 255, 0.5)"
  socialIconLight  = "#363636"
  socialIconDark   = "rgba(255, 255, 255, 0.5)"
  logoText         = "#E9DAAC"

[params.Colors]
  primary = "#E9DAAC"


[taxonomies]
author = "authors"
tag = "tags"

[params.giscus]
enabled = true
repo = "kwangsing3/kwangsing3.github.io"
repoId = "R_kgDOSywZxg"
category = "General"
categoryId = "DIC_kwDOSywZxs4C-oQc"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "zh-TW"

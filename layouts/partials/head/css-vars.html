{{- $t := .Site.Params.theme -}}
<style>
@property --lava-overlay-color {
  syntax: "<color>";
  inherits: true;
  initial-value: {{ $t.lavaOverlayLight | safeCSS }};
}
:root {
  --lava-overlay-light: {{ $t.lavaOverlayLight | safeCSS }};
  --lava-overlay-dark:  {{ $t.lavaOverlayDark  | safeCSS }};
  --lava-bg:            {{ $t.lavaBg            | safeCSS }};
  --glass-bg-light:     {{ $t.glassBgLight      | safeCSS }};
  --glass-bg-dark:      {{ $t.glassBgDark       | safeCSS }};
  --glass-border-light: {{ $t.glassBorderLight  | safeCSS }};
  --glass-border-dark:  {{ $t.glassBorderDark   | safeCSS }};
  --glass-shadow-light: {{ $t.glassShadowLight  | safeCSS }};
  --glass-shadow-dark:  {{ $t.glassShadowDark   | safeCSS }};
  --bio-text-light:     {{ $t.bioTextLight      | safeCSS }};
  --bio-text-dark:      {{ $t.bioTextDark       | safeCSS }};
  --footer-text-light:  {{ $t.footerTextLight   | safeCSS }};
  --footer-text-dark:   {{ $t.footerTextDark    | safeCSS }};
  --social-icon-light:  {{ $t.socialIconLight   | safeCSS }};
  --social-icon-dark:   {{ $t.socialIconDark    | safeCSS }};
  /* defaults (overridden by inline JS before first paint) */
  --lava-overlay-color: var(--lava-overlay-light);
  --glass-bg:     var(--glass-bg-light);
  --glass-border: var(--glass-border-light);
  --glass-shadow: var(--glass-shadow-light);
  --bio-text:     var(--bio-text-light);
  --footer-text:  var(--footer-text-light);
  --social-icon:  var(--social-icon-light);
}
</style>
